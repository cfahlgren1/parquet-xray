name: Deploy to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'cfahlgren1/parquet-xray'
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Check for a token
        if: env.HF_TOKEN == ''
        run: echo "::notice::Skipping deploy; add an HF_TOKEN secret with write access to the Space."
      - if: env.HF_TOKEN != ''
        uses: actions/checkout@v5
      - if: env.HF_TOKEN != ''
        uses: astral-sh/setup-uv@v6
      - if: env.HF_TOKEN != ''
        run: uv tool install huggingface_hub && ./scripts/deploy-space.sh
